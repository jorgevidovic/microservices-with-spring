server:
  port: ${STUDENT_APP_PORT}

spring:
  application:
    name: ${STUDENT_APP_NAME}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${STUDENT_DB_HOST}:${STUDENT_DB_PORT}/${STUDENT_DB_NAME}
    username: ${STUDENT_DB_USER}
    password: ${STUDENT_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: create
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  config:
    import: optional:configserver:http://${EUREKA_APP_HOST}:${EUREKA_APP_PORT}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://${EUREKA_APP_HOST}:${EUREKA_SERVER_PORT}/eureka