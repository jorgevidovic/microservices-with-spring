server:
  port: ${EUREKA_SERVER_PORT}

spring:
  application:
    name: ${EUREKA_APP_NAME}
  config:
    import: optional:configserver:http://${EUREKA_APP_HOST}:${EUREKA_APP_PORT}

eureka:
  instance:
    hostname: ${EUREKA_APP_HOST}
  client:
    register-with-eureka: false
    fetch-registry: false
    server-url:
      defaultZone: http://${EUREKA_APP_HOST}:${server.port}/eureka/
